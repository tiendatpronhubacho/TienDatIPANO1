workflows:
  xtool-build:
    name: Build TienDat IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          brew install xtool-org/tap/xtool
      - name: Build IPA
        script: |
          date +%s > .tiendat-build-start
          xtool dev build --ipa
      - name: Compile assets and normalize IPA resources
        script: |
          chmod +x Scripts/find-new-ipa.sh Scripts/fix-ipa-resources.sh
          IPA_PATH="$(Scripts/find-new-ipa.sh .tiendat-build-start)"
          Scripts/fix-ipa-resources.sh "$IPA_PATH"
      - name: Verify IPA artifact
        script: |
          IPA_PATH="$(Scripts/find-new-ipa.sh .tiendat-build-start)"
          /usr/bin/unzip -t "$IPA_PATH"
          echo "Verified unsigned IPA: $IPA_PATH"
    artifacts:
      - "**/*.ipa"
      - .build/release/**
