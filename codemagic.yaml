workflows:
  xtool-build:
    name: Build TienDat IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          brew install xtool-org/tap/xtool
      - name: Build IPA
        script: |
          xtool dev build --ipa
      - name: Verify IPA artifact
        script: |
          IPA_PATH="$(find . -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA was produced by xtool."
            exit 1
          fi
          echo "IPA produced: $IPA_PATH"
          unzip -t "$IPA_PATH"
    artifacts:
      - "**/*.ipa"
      - .build/release/**
